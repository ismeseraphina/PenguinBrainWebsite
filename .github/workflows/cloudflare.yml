name: Deploy to Cloudflare (website + backend)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN secret is not set yet, skipping deploy." >> $GITHUB_STEP_SUMMARY
            echo "ok=false" >> $GITHUB_OUTPUT
          else
            echo "ok=true" >> $GITHUB_OUTPUT
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.check.outputs.ok == 'true'
        run: npm ci
      - if: steps.check.outputs.ok == 'true'
        run: npm test && npm run build
      - name: Find Cloudflare account
        if: steps.check.outputs.ok == 'true'
        run: |
          ACC=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(!j.success){console.error(JSON.stringify(j.errors));process.exit(1)}process.stdout.write(j.result[0].id)})")
          echo "CLOUDFLARE_ACCOUNT_ID=$ACC" >> $GITHUB_ENV
      - name: Create D1 database if needed
        if: steps.check.outputs.ok == 'true'
        run: |
          ID=$(npx wrangler d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const l=JSON.parse(s);const d=l.find(x=>x.name==='penguinbrain');process.stdout.write(d?d.uuid:'')})")
          if [ -z "$ID" ]; then
            npx wrangler d1 create penguinbrain
            ID=$(npx wrangler d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const l=JSON.parse(s);process.stdout.write(l.find(x=>x.name==='penguinbrain').uuid)})")
          fi
          sed -i "s/__D1_ID__/$ID/" wrangler.jsonc
      - name: Make sure a workers.dev subdomain exists
        if: steps.check.outputs.ok == 'true'
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).result?.subdomain||'')}catch{}})")
          if [ -z "$SUB" ]; then
            for NAME in penguinbrain-seraphina seraphina-penguinbrain penguinbrain-$RANDOM; do
              OK=$(curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" -d "{\"subdomain\":\"$NAME\"}" "$API" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(String(JSON.parse(s).success))}catch{}})")
              if [ "$OK" = "true" ]; then SUB=$NAME; break; fi
            done
          fi
          echo "SUBDOMAIN=$SUB" >> $GITHUB_ENV
      - name: Deploy worker
        if: steps.check.outputs.ok == 'true'
        run: |
          npx wrangler deploy
          echo "## Website: https://penguinbrain.$SUBDOMAIN.workers.dev" >> $GITHUB_STEP_SUMMARY
